server.port=8080

# Application Name
spring.application.name=media-stream-platform

# H2 In-Memory Database Configuration (Out-of-the-box Zero Config)
spring.datasource.url=jdbc:h2:mem:mediastreamdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=EnterpriseSuperSecureSecretKeyForJwtTokenGenerationMustBe256BitsLong!9876543210
app.jwt.expiration-ms=86400000

# Optional: To switch to PostgreSQL, uncomment the following:
# spring.datasource.url=jdbc:postgresql://localhost:5432/mediastreamdb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
